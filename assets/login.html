<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 - 文件管理系统 - 北京博奥瑞科技有限公司</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b1020;
    color: #1e293b;
    overflow: hidden;
    position: relative;
  }
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 15% 20%, rgba(59, 130, 246, .28), transparent 60%),
      radial-gradient(700px 500px at 85% 75%, rgba(29, 78, 216, .24), transparent 60%),
      radial-gradient(500px 400px at 70% 15%, rgba(14, 165, 233, .14), transparent 60%),
      linear-gradient(160deg, #0b1020 0%, #111a33 55%, #0b1020 100%);
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, .05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .card {
    position: relative;
    width: min(400px, calc(100vw - 40px));
    background: rgba(255, 255, 255, .98);
    border-radius: 20px;
    padding: 44px 40px 36px;
    box-shadow: 0 24px 64px rgba(2, 6, 23, .5), 0 4px 16px rgba(2, 6, 23, .3);
    animation: rise .5s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .35);
    margin-bottom: 18px;
  }
  .brand-logo svg { width: 32px; height: 32px; }
  .brand-company {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #0f172a;
  }
  .brand-system {
    margin-top: 6px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #64748b;
  }
  .brand-divider {
    margin-top: 18px;
    width: 44px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3b82f6, #1d4ed8);
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 14px;
    color: #0f172a;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder { color: #94a3b8; }
  .field input:focus {
    border-color: #3b82f6;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
  }
  .error {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 18px;
  }
  .error.show { display: flex; }
  .submit {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #fff;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    box-shadow: 0 6px 16px rgba(37, 99, 235, .35);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .submit:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(37, 99, 235, .45);
  }
  .submit:active:not(:disabled) { transform: translateY(0); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .footer {
    position: relative;
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(148, 163, 184, .75);
    text-align: center;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9z" fill="rgba(255,255,255,.92)"/>
        <path d="M3 10.5h18v6a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-6z" fill="#fff"/>
      </svg>
    </div>
    <div class="brand-company">文件管理系统</div>
    <div class="brand-system">北京博奥瑞科技有限公司</div>
    <div class="brand-divider"></div>
  </div>
  <form id="login-form" autocomplete="off">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" placeholder="请输入用户名" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" required>
    </div>
    <div class="error" id="error" role="alert">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3.5a.75.75 0 0 1-1.5 0V5zM8 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
      <span id="error-text">用户名或密码错误</span>
    </div>
    <button class="submit" id="submit-btn" type="submit">登 录</button>
  </form>
</div>
<div class="footer">© 2026 北京博奥瑞科技有限公司 · 文件管理系统</div>
<script>
(function () {
  var form = document.getElementById('login-form');
  var errorBox = document.getElementById('error');
  var errorText = document.getElementById('error-text');
  var btn = document.getElementById('submit-btn');
  var $user = document.getElementById('username');
  var $pass = document.getElementById('password');

  function targetUrl() {
    var url = new URL(location.href);
    url.searchParams.delete('login');
    return url;
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('show');
  }

  function encodeBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var user = $user.value;
    var pass = $pass.value;
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = '登录中…';
    fetch(targetUrl().toString(), {
      method: 'CHECKAUTH',
      headers: { 'Authorization': 'Basic ' + encodeBase64(user + ':' + pass) }
    }).then(function (res) {
      return res.text().then(function (text) {
        if (res.ok && text) {
          // The session cookie set by CHECKAUTH carries the credentials from
          // now on, so navigate without embedding user:pass in the URL.
          location.replace(targetUrl().toString());
        } else {
          showError('用户名或密码错误');
          $pass.value = '';
          $pass.focus();
        }
      });
    }).catch(function () {
      showError('网络错误，请稍后重试');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  });
})();
</script>
</body>
</html>
